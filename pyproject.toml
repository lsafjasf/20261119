[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-spatial-tracker"
version = "0.1.0"
description = "Error-corrected square watermark detection and short-occlusion tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
watermark-tracker = "watermark_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["watermark_tracker*"]

