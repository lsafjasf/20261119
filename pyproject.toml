[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portraitcrop"
version = "0.1.0"
description = "Content-aware portrait cropping with speed and acceleration constraints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
portraitcrop = "portraitcrop.cli:main"

[tool.setuptools.packages.find]
include = ["portraitcrop*"]
