[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-markers"
version = "0.1.0"
description = "Lossless clip and timeline markers with media, clip, and global anchors"
requires-python = ">=3.10"

[project.scripts]
timeline-markers = "timeline_markers.cli:main"

[tool.setuptools.packages.find]
include = ["timeline_markers*"]
